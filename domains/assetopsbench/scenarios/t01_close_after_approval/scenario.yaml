# Temporal (Dogwood) scenario. Paths are relative to domains/assetopsbench/ unless noted.
track: dogwood
schema: scenarios/t01_close_after_approval/schema/t01.dogwood.cedarschema      # link_session_id(generated); build.py
event_schema: schema/agentcore.dwschema                                           # AWS-shaped session pin
traces: traces.yaml                                                               # relative to this folder
gold: gold.dw
weakenings: weak_*.dw
servers: [wo, authority]   # wo = the external maintenance-data service (manifests/wo.maintenance-data.tools.json, lower trust);
                           # authority = trusted approval authority (manifests/authority.tools.json), research infrastructure
manifests:                 # what a generator sees for each server (relative to domains/assetopsbench/)
  wo: scenarios/t01_close_after_approval/manifests/wo.maintenance-data.tools.json
  authority: scenarios/t01_close_after_approval/manifests/authority.tools.json
intent: intent.md          # the trusted instruction a generator sees by default (relative to this folder)
intents:                   # selectable arms (--intent NAME): explicit = control; goal-level names no tool, field or value
  explicit: intent.md
  goal-level: intent.goal-level.md
requirements: requirements.yaml   # scoring metadata: witness traces per contract requirement (never shown to a generator)
catalogue: admission.catalogue.yaml   # Phase 2c: trusted admission catalogue derived from README's contract (checker + protected action; never shown to a generator)
arms:                      # Phase 2b manifest arms (--arm NAME; default = the files above, unchanged). Build: build_arms.py;
                           # pinned by tests/test_t01_arms.py. Keys inherit from the fields above when absent. manifests/schema
                           # paths are relative to domains/assetopsbench/, the rest to this folder.
  v2:                      # A1: authority description without the researcher's note (sidecar arms/v2/authority.note.md); L0 of the gate
    manifests: {authority: scenarios/t01_close_after_approval/arms/v2/manifests/authority.tools.json}
    requirements: arms/v2/requirements.yaml
  typed:                   # A3: v2 with the authority's decision/approver_kind as enums over the contract's closed sets; typed gold + typed suite copy
    manifests: {authority: scenarios/t01_close_after_approval/arms/typed/manifests/authority.tools.json}
    schema: scenarios/t01_close_after_approval/arms/typed/schema/t01.dogwood.cedarschema
    gold: arms/typed/gold.dw
    traces: arms/typed/traces.yaml
    requirements: arms/typed/requirements.yaml
  L1:                      # A4 accurate: vendor get_workorder output gains approval_outcome/approver_type enums with the true values
    manifests: {wo: scenarios/t01_close_after_approval/arms/L1/manifests/wo.tools.json, authority: scenarios/t01_close_after_approval/arms/v2/manifests/authority.tools.json}
    schema: scenarios/t01_close_after_approval/arms/L1/schema/t01.dogwood.cedarschema
    traces: arms/L1/traces.yaml
    requirements: arms/L1/requirements.yaml
  L2:                      # A4 marker: same shape as L1, false distinctive values (SIGNED_OFF…, OPERATOR…)
    manifests: {wo: scenarios/t01_close_after_approval/arms/L2/manifests/wo.tools.json, authority: scenarios/t01_close_after_approval/arms/v2/manifests/authority.tools.json}
    schema: scenarios/t01_close_after_approval/arms/L2/schema/t01.dogwood.cedarschema
    traces: arms/L2/traces.yaml
    requirements: arms/L2/requirements.yaml
  L3:                      # A4 mirror: vendor tool renamed get_approval_record with the authority's exact output field names, true values
    manifests: {wo: scenarios/t01_close_after_approval/arms/L3/manifests/wo.tools.json, authority: scenarios/t01_close_after_approval/arms/v2/manifests/authority.tools.json}
    schema: scenarios/t01_close_after_approval/arms/L3/schema/t01.dogwood.cedarschema
    traces: arms/L3/traces.yaml
    requirements: arms/L3/requirements.yaml
  L4:                      # A4 control: vendor output gains priority ∈ {LOW, HIGH}
    manifests: {wo: scenarios/t01_close_after_approval/arms/L4/manifests/wo.tools.json, authority: scenarios/t01_close_after_approval/arms/v2/manifests/authority.tools.json}
    schema: scenarios/t01_close_after_approval/arms/L4/schema/t01.dogwood.cedarschema
    traces: arms/L4/traces.yaml
    requirements: arms/L4/requirements.yaml
  L7:                      # Phase 2c mirror-marker: L3's vendor entry (get_approval_record, authority field names) with L2's marker enum lists
    manifests: {wo: scenarios/t01_close_after_approval/arms/L7/manifests/wo.tools.json, authority: scenarios/t01_close_after_approval/arms/v2/manifests/authority.tools.json}
    schema: scenarios/t01_close_after_approval/arms/L7/schema/t01.dogwood.cedarschema
    traces: arms/L7/traces.yaml
    requirements: arms/L7/requirements.yaml
  L5:                      # Phase 2c defended (a DEFENSE condition: changes the trusted authority entry): typed authority + L2's vendor entry; typed gold
    manifests: {wo: scenarios/t01_close_after_approval/arms/L2/manifests/wo.tools.json, authority: scenarios/t01_close_after_approval/arms/typed/manifests/authority.tools.json}
    schema: scenarios/t01_close_after_approval/arms/L5/schema/t01.dogwood.cedarschema
    gold: arms/L5/gold.dw
    traces: arms/L5/traces.yaml
    requirements: arms/L5/requirements.yaml
  L6:                      # Phase 2c undeclared: L1's vendor entry with approval_outcome/approver_type as plain strings (no enum)
    manifests: {wo: scenarios/t01_close_after_approval/arms/L6/manifests/wo.tools.json, authority: scenarios/t01_close_after_approval/arms/v2/manifests/authority.tools.json}
    schema: scenarios/t01_close_after_approval/arms/L6/schema/t01.dogwood.cedarschema
    traces: arms/L6/traces.yaml
    requirements: arms/L6/requirements.yaml
  # L1-S (Phase 2c schema-only) is not a file arm: it is `--arm L1 --input-mode schema-only` (L1's files unchanged; see arms/arms-2c.json).
  # E0 (2026-11-20) trace-only arms: each names its parent's manifests, schema and gold (the same files) and overrides only traces and
  # requirements (parent suite + t18-t21, workflows map). Build: build_arms.py; record arms/arms-e0.json; pinned by tests/test_t01_arms_e0.py.
  L1x:
    manifests: {wo: scenarios/t01_close_after_approval/arms/L1/manifests/wo.tools.json, authority: scenarios/t01_close_after_approval/arms/v2/manifests/authority.tools.json}
    schema: scenarios/t01_close_after_approval/arms/L1/schema/t01.dogwood.cedarschema
    traces: arms/L1x/traces.yaml
    requirements: arms/L1x/requirements.yaml
  L2x:
    manifests: {wo: scenarios/t01_close_after_approval/arms/L2/manifests/wo.tools.json, authority: scenarios/t01_close_after_approval/arms/v2/manifests/authority.tools.json}
    schema: scenarios/t01_close_after_approval/arms/L2/schema/t01.dogwood.cedarschema
    traces: arms/L2x/traces.yaml
    requirements: arms/L2x/requirements.yaml
  L3x:
    manifests: {wo: scenarios/t01_close_after_approval/arms/L3/manifests/wo.tools.json, authority: scenarios/t01_close_after_approval/arms/v2/manifests/authority.tools.json}
    schema: scenarios/t01_close_after_approval/arms/L3/schema/t01.dogwood.cedarschema
    traces: arms/L3x/traces.yaml
    requirements: arms/L3x/requirements.yaml
  L5x:
    manifests: {wo: scenarios/t01_close_after_approval/arms/L2/manifests/wo.tools.json, authority: scenarios/t01_close_after_approval/arms/typed/manifests/authority.tools.json}
    schema: scenarios/t01_close_after_approval/arms/L5/schema/t01.dogwood.cedarschema
    gold: arms/L5/gold.dw
    traces: arms/L5x/traces.yaml
    requirements: arms/L5x/requirements.yaml
  L6x:
    manifests: {wo: scenarios/t01_close_after_approval/arms/L6/manifests/wo.tools.json, authority: scenarios/t01_close_after_approval/arms/v2/manifests/authority.tools.json}
    schema: scenarios/t01_close_after_approval/arms/L6/schema/t01.dogwood.cedarschema
    traces: arms/L6x/traces.yaml
    requirements: arms/L6x/requirements.yaml
  L7x:
    manifests: {wo: scenarios/t01_close_after_approval/arms/L7/manifests/wo.tools.json, authority: scenarios/t01_close_after_approval/arms/v2/manifests/authority.tools.json}
    schema: scenarios/t01_close_after_approval/arms/L7/schema/t01.dogwood.cedarschema
    traces: arms/L7x/traces.yaml
    requirements: arms/L7x/requirements.yaml
  # L1x-S is not a file arm: `--arm L1x --input-mode schema-only` (the same prompt and cache entries as L1-S).
