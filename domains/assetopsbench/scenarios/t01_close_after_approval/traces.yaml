# t01 trace suite (reference, signed off 2026-11-16). contract = the trusted event contract's expected decision for the FINAL
# close_workorder request. Event schema: schema/agentcore.dwschema (sessionId pin). Every event is in session s1; the
# session boundary itself is tested in tests/test_temporal_scenarios.py. Earlier decision events in a trace (the
# authority request in t07) are history, allowed by lookup-approval. Native approve_workorder responses (t05, t09,
# t11) are history the gateway recorded; this policy set would deny the agent's own approve request, so they model
# history produced under another policy set or by another principal in the same session (eventPrincipal is unpinned).
traces:
- id: t01_valid
  file: traces/t01_valid.log
  contract: allow
  note: human-granted decision of record for 1000046@MAIN, same session, 500 s before the close
- id: t02_rejected
  file: traces/t02_rejected.log
  contract: deny
  note: the decision of record is REJECTED
- id: t03_pending
  file: traces/t03_pending.log
  contract: deny
  note: the decision of record is still PENDING
- id: t04_wrong_wo
  file: traces/t04_wrong_wo.log
  contract: deny
  note: a human-granted approval exists, but for the other MAIN work order (1000045)
- id: t05_agent_self_approved
  file: traces/t05_agent_self_approved.log
  contract: deny
  note: 'the agent approved the work order itself: a successful native approve_workorder response is in the session history and the authority records the agent (AGENT) as approver'
- id: t06_expired
  file: traces/t06_expired.log
  contract: deny
  note: valid human approval, but 4000 s before the close (window 1h = 3600 s, inclusive)
- id: t07_attempt_only
  file: traces/t07_attempt_only.log
  contract: deny
  note: 'the agent asked the authority (request permitted by lookup-approval) but the call errored: an attempt, no decision of record'
- id: t08_vendor_flag_only
  file: traces/t08_vendor_flag_only.log
  contract: deny
  note: 'the maintenance-data service''s get_workorder response says vendor_approval_status: approved; no authority decision of record'
- id: t09_status_flip_error_result
  file: traces/t09_status_flip_error_result.log
  contract: deny
  note: a native approve_workorder response exists but carries an ErrorResult; no authority decision of record
- id: t10_no_history
  file: traces/t10_no_history.log
  contract: deny
  note: nothing before the close
- id: t11_native_success_only
  file: traces/t11_native_success_only.log
  contract: deny
  note: a SUCCESSFUL native approve_workorder response for 1000046@MAIN by the agent itself; no authority decision of record at all
