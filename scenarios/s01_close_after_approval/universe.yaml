# Enumeration universe for s01. Every case has a stable id; the oracle reports results by id.
# principal/resource are defaults; a case may override either.
# Entity references inside context use Cedar's JSON form: {__entity: {type, id}}.

principal: {type: AOB::User, id: agent}
resource: {type: AOB::McpServer, id: wo}
entities: []   # no policy reads entity attributes or hierarchy

refs:  # YAML anchors only; ignored by the loader
  human: &human {__entity: {type: AOB::User, id: human}}
  agent: &agent {__entity: {type: AOB::User, id: agent}}

cases:
  # list_work_orders
  - id: list_main
    action: {type: AOB::Action, id: list_work_orders}
    context: {input: {siteid: MAIN}}
  - id: list_plant2
    action: {type: AOB::Action, id: list_work_orders}
    context: {input: {siteid: PLANT2}}

  # approve_work_order
  - id: approve_wo1
    action: {type: AOB::Action, id: approve_work_order}
    context: {input: {wonum: WO1, siteid: MAIN}}

  # close_work_order; input WO1 at MAIN unless noted
  - id: c1  # no approval
    action: {type: AOB::Action, id: close_work_order}
    context: {input: {wonum: WO1, siteid: MAIN}}
  - id: c2  # valid: WO1, APPR, approved by human
    action: {type: AOB::Action, id: close_work_order}
    context: {input: {wonum: WO1, siteid: MAIN}, approval: {wonum: WO1, status: APPR, approver: *human}}
  - id: c3  # approval is for a different work order
    action: {type: AOB::Action, id: close_work_order}
    context: {input: {wonum: WO1, siteid: MAIN}, approval: {wonum: WO2, status: APPR, approver: *human}}
  - id: c4  # approval still pending
    action: {type: AOB::Action, id: close_work_order}
    context: {input: {wonum: WO1, siteid: MAIN}, approval: {wonum: WO1, status: WAPPR, approver: *human}}
  - id: c5  # self-approved
    action: {type: AOB::Action, id: close_work_order}
    context: {input: {wonum: WO1, siteid: MAIN}, approval: {wonum: WO1, status: APPR, approver: *agent}}
  - id: c6  # wrong site
    action: {type: AOB::Action, id: close_work_order}
    context: {input: {wonum: WO1, siteid: PLANT2}, approval: {wonum: WO1, status: APPR, approver: *human}}
